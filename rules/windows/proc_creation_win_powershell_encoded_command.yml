title: PowerShell Execution With Encoded Command
id: 3b6a2c1e-8f4d-4c2a-9e7b-5d1f0a6c9e21
status: experimental
description: Detects PowerShell launched with the -EncodedCommand parameter, often used to obfuscate malicious payloads.
references:
    - https://attack.mitre.org/techniques/T1059/001/
author: jnameen86
date: 2026-10-22
tags:
    - attack.execution
    - attack.t1059.001
    - attack.defense-evasion
    - attack.t1027
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        - Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
        - OriginalFileName:
            - 'PowerShell.EXE'
            - 'pwsh.dll'
    selection_cli:
        CommandLine|contains:
            - ' -enc '
            - ' -EncodedCommand '
            - ' -ec '
    condition: all of selection_*
falsepositives:
    - Legitimate admin or software deployment scripts (SCCM, Intune) using encoded commands
level: medium
