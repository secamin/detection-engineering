title: CVE-2026-109618 PHP Session Upload Progress Abuse In Multipart POST
id: 8c917248-188a-4b14-a500-600c2a2fd0da
status: experimental
description: |
    Generic (non-PoC-specific) detection for PHP2Shell. Detects multipart POST requests to PHP endpoints that
    carry the PHP_SESSION_UPLOAD_PROGRESS field together with heavy array spraying (t[]), the pattern used to
    trigger the use-after-free. Requires WAF / proxy request-body logging.
    Correlate with 5xx (often 502) responses from the PHP worker: failed attempts crash the worker.
references:
    - https://www.upwind.io/feed/initial-assessment-php2shell-two-critical-unpatched-php-rces-cve-2026-109618-cve-2026-109619
author: secamin
date: 2026-10-22
tags:
    - attack.initial-access
    - attack.t1190
    - cve.2026-109618
logsource:
    category: proxy
detection:
    selection:
        cs-method: 'POST'
        cs-content-type|contains: 'multipart/form-data'
        cs-body|contains: 'PHP_SESSION_UPLOAD_PROGRESS'
    spray:
        cs-body|contains: 't[]'
    condition: selection and spray
falsepositives:
    - Applications that legitimately use PHP upload progress tracking (they will not normally send large t[] arrays)
level: high
